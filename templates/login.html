<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DermaScan — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <style>
    body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-wrap { width: 100%; max-width: 420px; padding: 2rem; }
    .auth-brand { text-align: center; margin-bottom: 2rem; }
    .auth-brand h1 { font-family: var(--font-display); font-size: 2.2rem; color: var(--accent); }
    .auth-brand p  { font-size: 0.88rem; color: var(--text-soft); margin-top: 0.3rem; }
    .auth-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
      box-shadow: 0 8px 32px rgba(61,122,90,0.1);
    }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 1.8rem; background: var(--bg3); border-radius: 10px; padding: 0.3rem; }
    .auth-tab {
      flex: 1; padding: 0.55rem; text-align: center;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      border-radius: 8px; color: var(--text-soft);
      background: transparent; border: none; transition: all 0.2s;
      font-family: var(--font-body);
    }
    .auth-tab.active { background: var(--bg2); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .field { margin-bottom: 1.1rem; }
    .field label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text); margin-bottom: 0.4rem; }
    .field input {
      width: 100%; padding: 0.7rem 1rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.92rem;
      color: var(--text); font-family: var(--font-body);
      outline: none; transition: border-color 0.2s; box-sizing: border-box;
    }
    .field input:focus { border-color: var(--accent2); }
    .auth-btn {
      width: 100%; padding: 0.8rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 999px;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.2s; margin-top: 0.5rem;
    }
    .auth-btn:hover { background: #2f6347; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error {
      background: #fdf0eb; border: 1px solid #f0cfc2;
      border-radius: 10px; padding: 0.7rem 1rem;
      font-size: 0.85rem; color: #c47a5a;
      margin-bottom: 1rem; display: none;
    }
    .auth-note { font-size: 0.78rem; color: var(--text-soft); text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <h1>DermaScan</h1>
    <p>Skin Type Recognition System</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login"    onclick="switchTab('login')">Login</button>
      <button class="auth-tab"        id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Login form -->
    <div id="form-login">
      <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="Enter your username" autocomplete="username"/></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password"/></div>
      <button class="auth-btn" onclick="doLogin()">Login →</button>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="field"><label>Username</label><input type="text" id="reg-user" placeholder="Choose a username (min 3 chars)"/></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="Choose a password (min 6 chars)"/></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="reg-pass2" placeholder="Repeat your password"/></div>
      <button class="auth-btn" onclick="doRegister()">Create Account →</button>
    </div>

    <p class="auth-note">This app is part of a Senior Research Project on skin type recognition.</p>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('form-login').style.display    = tab==='login'    ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? 'block' : 'none';
  showError('');
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent  = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  if (!username || !password) { showError('Please fill in all fields.'); return; }
  const res  = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (data.error) { showError(data.error); return; }
  window.location.href = data.role === 'admin' ? '/admin' : '/';
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value.trim();
  const pass2    = document.getElementById('reg-pass2').value.trim();
  if (!username || !password) { showError('Please fill in all fields.'); return; }
  if (password !== pass2)     { showError('Passwords do not match.');    return; }
  const res  = await fetch('/api/auth/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (data.error) { showError(data.error); return; }
  window.location.href = '/';
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('form-login').style.display !== 'none') doLogin();
  else doRegister();
});
</script>
</body>
</html>
